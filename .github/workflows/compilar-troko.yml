name: Compilar Troko (ST7735)

on:
  workflow_dispatch:

jobs:
  compilar:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v6.1
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Compilar firmware
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          python -m pip install --quiet rich-click || true
          idf.py --version
          python scripts/build.py wk-esp32s3-dev --name troko-st7735 \
            --language es-ES \
            --custom-wake-word lolo --custom-wake-word-display Lolo

      - name: Guardar el .bin
        uses: actions/upload-artifact@v4
        with:
          name: troko-st7735-firmware
          path: build/merged-binary.bin
